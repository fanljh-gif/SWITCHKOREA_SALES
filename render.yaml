services:
  - type: web
    name: switch-korea-sales-test
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: switch-korea-sales-test-db
          property: connectionString
      - key: SWITCHKOREA_HOSTING_MODE
        value: Render
      - key: Research__Provider
        value: Disabled
      - key: Research__ApiKey
        sync: false
      - key: Research__Model
        value: gpt-5.4-mini
      - key: Research__WeeklyDay
        value: Monday
      - key: Research__WeeklyTime
        value: '09:00:00'
      - key: Research__MonthlyLimit
        value: '100000'

databases:
  - name: switch-korea-sales-test-db
    plan: free
    region: singapore
    postgresMajorVersion: '18'
    databaseName: switch_korea_sales_test
    user: switch_korea_app
